name: Migrar archivos originales de María Luciana
on:
  push:
    paths:
      - '.github/workflows/migrar-invitacion.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copiar contenido exacto desde Aura Digital y verificar
        run: |
          set -euo pipefail
          SOURCE='https://raw.githubusercontent.com/AuraDigitalJal/AuraDigitalJal.github.io/main/pruebas/cerradura-luciana-2026'
          curl -fsSL --retry 3 "$SOURCE/portada.jpg" -o portada.jpg
          curl -fsSL --retry 3 "$SOURCE/contenido.jpg" -o contenido.jpg
          curl -fsSL --retry 3 "$SOURCE/miniatura-whatsapp.jpg" -o miniatura-whatsapp.jpg
          curl -fsSL --retry 3 "$SOURCE/transicion.mp4" -o transicion.mp4
          curl -fsSL --retry 3 "$SOURCE/musica.mp3" -o musica.mp3
          python3 - <<'PY'
          import subprocess
          expected = {
            'portada.jpg':'f49a5db71279de509b5ba7c6ebfb743ba72603ce',
            'contenido.jpg':'cfa0dbcd33a201046cf38214dc9796ff791b95e5',
            'miniatura-whatsapp.jpg':'95e1162e512138126fefc6db5a00617076a83587',
            'transicion.mp4':'b07d8121aa78d713187269dbe753d23f171aa7a9',
            'musica.mp3':'a2adaf364fc141d9bbbdcbf14ba0761882266e43',
          }
          for path, sha in expected.items():
            got=subprocess.check_output(['git','hash-object',path],text=True).strip()
            print(f'{path}: {got}')
            if got != sha: raise RuntimeError(f'El archivo {path} no coincide con el original')
          PY
          touch .nojekyll
      - name: Guardar archivos en repositorio independiente
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add portada.jpg contenido.jpg miniatura-whatsapp.jpg transicion.mp4 musica.mp3 .nojekyll
          git rm --force .github/workflows/migrar-invitacion.yml
          git commit -m "Migrar intactos todos los archivos multimedia de María Luciana"
          git push origin HEAD:main
